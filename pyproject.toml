[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-vox-sentry"
version = "0.1.0"
description = "A local-first GNOME sentinel for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vox Sentry contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vox-sentry = "vox_sentry.cli:main"
vox-sentryd = "vox_sentry.daemon:main"

[tool.setuptools.packages.find]
include = ["vox_sentry*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
